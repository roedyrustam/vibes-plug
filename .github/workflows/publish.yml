name: Publish Release, NPM Package & Marketplace VSIX

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type if current version is already on npm (patch | minor | major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-release-npm
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    name: Quality Gate, Auto-Version, VSIX & NPM Publish
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message || '', '[skip ci]') && !startsWith(github.event.head_commit.message || '', 'chore(release):')"
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPMS }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Sovereign Quality Gate & Tests
        run: |
          node scripts/validate-skills.mjs
          node scripts/check-anti-slop.js --strict
          node --test scripts/test-cli.mjs

      - name: Run Performance Benchmark Suite
        run: node scripts/benchmark-suite.mjs

      - name: Resolve & Synchronize NPM Version
        id: version_sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view vibes-plug version 2>/dev/null || echo "0.0.0")
          echo "Local package.json version : v${LOCAL_VERSION}"
          echo "Published npm version      : v${PUBLISHED_VERSION}"

          BUMP_TYPE="${{ github.event.inputs.bump || 'patch' }}"
          IS_BRANCH_PUSH="false"
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/master" ]]; then
            IS_BRANCH_PUSH="true"
          fi

          if [[ "${LOCAL_VERSION}" == "${PUBLISHED_VERSION}" ]]; then
            if [[ "${IS_BRANCH_PUSH}" == "true" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo "Version v${LOCAL_VERSION} is already published on npm. Auto-bumping (${BUMP_TYPE})..."
              node bin/vibes.mjs version bump "${BUMP_TYPE}"
              NEW_VERSION=$(node -p "require('./package.json').version")
              git add -A
              git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
              git tag -f "v${NEW_VERSION}"
              git push origin HEAD:${GITHUB_REF_NAME}
              git push origin "v${NEW_VERSION}" --force
              echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
              echo "release_tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag/Release version v${LOCAL_VERSION} is already published on npm. Skipping duplicate npm publish."
              echo "version=${LOCAL_VERSION}" >> "$GITHUB_OUTPUT"
              echo "release_tag=v${LOCAL_VERSION}" >> "$GITHUB_OUTPUT"
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Local version v${LOCAL_VERSION} differs from npm v${PUBLISHED_VERSION}. Preparing to publish v${LOCAL_VERSION}..."
            if ! git rev-parse "v${LOCAL_VERSION}" >/dev/null 2>&1; then
              git tag "v${LOCAL_VERSION}"
              git push origin "v${LOCAL_VERSION}" || true
            fi
            echo "version=${LOCAL_VERSION}" >> "$GITHUB_OUTPUT"
            echo "release_tag=v${LOCAL_VERSION}" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package VS Code & Cursor VSIX Extension
        run: |
          node bin/vibes.mjs package:vscode
          cd extensions/vscode
          sha256sum *.vsix > checksums.sha256
          cat checksums.sha256

      - name: Create or Update GitHub Release with VSIX & Checksums
        uses: softprops/action-gh-release@v3
        if: steps.version_sync.outputs.should_publish == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        with:
          tag_name: ${{ steps.version_sync.outputs.release_tag }}
          name: Vibes-Plug ${{ steps.version_sync.outputs.release_tag }}
          files: |
            extensions/vscode/*.vsix
            extensions/vscode/checksums.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Package to GitHub Packages Registry
        if: steps.version_sync.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_VERSION="${{ steps.version_sync.outputs.version }}"
          echo "Publishing to GitHub Packages registry (npm.pkg.github.com)..."
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("./package.json", "utf8"));
            pkg.name = "@roedyrustam/vibes-plug";
            pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
            fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2));
          '
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          npm publish --access public || echo "GitHub Packages publish completed or version already exists"
          git checkout package.json
          echo "### 📦 Linked & Published to GitHub Packages: `@roedyrustam/vibes-plug@${TARGET_VERSION}`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Package to npm Registry
        if: steps.version_sync.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPMS }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPMS }}
        run: |
          TARGET_VERSION="${{ steps.version_sync.outputs.version }}"
          echo "Publishing vibes-plug@${TARGET_VERSION} to npm..."

          PUBLISH_SUCCESS=false

          # 1. Primary Strategy: OIDC Trusted Publishing (tokenless, modern standard compliant with npm 2026 security guidelines)
          echo "Attempting primary publish method: npm Trusted Publishing via OIDC..."
          # Ensure no stale auth token interferes with OIDC exchange
          sed -i '/_authToken/d' ~/.npmrc 2>/dev/null || true

          if npm publish --provenance --access public; then
            echo "### ✅ Published \`vibes-plug@${TARGET_VERSION}\` to npm via OIDC Trusted Publisher (with provenance)" >> "$GITHUB_STEP_SUMMARY"
            PUBLISH_SUCCESS=true
          else
            echo "OIDC Trusted Publishing did not succeed, checking fallback to legacy NPM_TOKEN..."
          fi

          # 2. Fallback Strategy: Legacy Static Token (NPM_TOKEN / NPMS)
          if [[ "${PUBLISH_SUCCESS}" != "true" && -n "${NPM_TOKEN}" ]]; then
            echo "Attempting fallback publish using NPM_TOKEN / NPMS secret..."
            echo "::warning::Static tokens (especially GAT bypass2fa) are deprecated by npm. Please migrate to Trusted Publishing."
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            if npm publish --provenance --access public; then
              echo "### ✅ Published \`vibes-plug@${TARGET_VERSION}\` to npm via legacy NPM_TOKEN (with provenance)" >> "$GITHUB_STEP_SUMMARY"
              PUBLISH_SUCCESS=true
            elif npm publish --access public; then
              echo "### ✅ Published \`vibes-plug@${TARGET_VERSION}\` to npm via legacy NPM_TOKEN" >> "$GITHUB_STEP_SUMMARY"
              PUBLISH_SUCCESS=true
            fi
          fi

          if [[ "${PUBLISH_SUCCESS}" != "true" ]]; then
            echo "::error::Gagal publish ke npm karena OIDC Trusted Publisher dan NPM_TOKEN fallback belum siap."
            {
              echo "### ⚠️ Konfigurasi Autentikasi NPM Diperlukan"
              echo "Sesuai kebijakan keamanan npm terbaru (Deprecasi GAT bypass2fa & Install-Time Security), gunakan **OIDC Trusted Publisher**:"
              echo "1. **Konfigurasi OIDC Trusted Publisher (Direkomendasikan & Standar Baru)**:"
              echo "   - Buka https://www.npmjs.com/package/vibes-plug/access"
              echo "   - Pada bagian **Trusted Publisher**, klik **Add publisher** → **GitHub Actions**"
              echo "   - Isi Owner: \`roedyrustam\`, Repository: \`vibes-plug\`, Workflow filename: \`publish.yml\`"
              echo "2. **Fallback Token Statis (Hingga batas deprecasi Jan 2027)**:"
              echo "   - Tambahkan Automation Token ke GitHub Secrets dengan nama \`NPM_TOKEN\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
