name: Publish Release & Marketplace VSIX

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build VSIX & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Sovereign Quality Gate & Tests
        run: |
          node scripts/validate-skills.mjs
          node scripts/check-anti-slop.js --strict
          node --test scripts/test-cli.mjs

      - name: Run Performance Benchmark Suite
        run: node scripts/benchmark-suite.mjs

      - name: Package VS Code & Cursor VSIX Extension
        run: |
          node bin/vibes.mjs package:vscode
          cd extensions/vscode
          sha256sum *.vsix > checksums.sha256
          cat checksums.sha256

      - name: Attach VSIX & Checksums to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        with:
          files: |
            extensions/vscode/*.vsix
            extensions/vscode/checksums.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
