name: VibesPlug CI & Anti-Slop Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sovereign-guard:
    name: Sovereign Guard & Anti-Slop Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate 178 Skills Ecosystem & Orchestrator Sync
        run: |
          node scripts/audit-graph.mjs
          node scripts/validate-skills.mjs
          node scripts/verify-skill-snippets.mjs

      - name: Run Sovereign Anti-Slop Strict Audit (Zero Slop Standard)
        run: node scripts/check-anti-slop.js --strict

      - name: Verify Web Showcase Syntax & Data Integrity
        run: |
          node --check showcase/app.js
          node --check showcase/skills-data.js

      - name: Verify CLI Help, Version & Commands
        run: |
          node bin/vibes.mjs help
          node bin/vibes.mjs version current
          node bin/vibes.mjs detect --help

      - name: Run Performance Benchmark Suite (7 SLAs)
        run: node scripts/benchmark-suite.mjs

      - name: Package VS Code & Cursor Companion Extension (.vsix)
        run: node bin/vibes.mjs package:vscode

      - name: Upload VSIX Extension Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibes-plug-companion-vsix
          path: extensions/vscode/*.vsix
          retention-days: 14

  test-matrix:
    name: Test Matrix (${{ matrix.os }} - Node ${{ matrix.node-version }})
    needs: sovereign-guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['20.x', '22.x', '24.x']

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Installer Scripts Syntax
        run: |
          bash -n install.sh
        if: runner.os != 'Windows'

      - name: Run Full CLI, Studio & MCP Integration Test Suite (55 Tests)
        run: node --test scripts/test-cli.mjs

      - name: Run Autonomous CI Healer Diagnostics on Failure
        if: failure()
        run: node scripts/self-healer.mjs --dry-run

  security-audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      - name: Run npm Audit
        run: npm audit --audit-level=high
        continue-on-error: true
