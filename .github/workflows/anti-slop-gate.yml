name: VibesPlug CI & Anti-Slop Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sovereign-guard:
    name: Sovereign Guard & Anti-Slop Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate 176 Skills Ecosystem & Orchestrator Sync
        run: node scripts/validate-skills.mjs

      - name: Run Sovereign Anti-Slop Strict Audit (Zero Slop Standard)
        run: node scripts/check-anti-slop.js --strict

      - name: Verify Web Showcase Syntax & Data Integrity
        run: |
          node --check showcase/app.js
          node --check showcase/skills-data.js

      - name: Verify CLI Help, Version & Commands
        run: |
          node bin/vibes.mjs help
          node bin/vibes.mjs version current
          node bin/vibes.mjs detect --help

      - name: Run Performance Benchmark Suite (7 SLAs)
        run: node scripts/benchmark-suite.mjs

      - name: Package VS Code & Cursor Companion Extension (.vsix)
        run: node bin/vibes.mjs package:vscode

      - name: Upload VSIX Extension Artifact
        uses: actions/upload-artifact@v7
        with:
          name: vibes-plug-companion-vsix
          path: extensions/vscode/*.vsix
          retention-days: 14

  test-matrix:
    name: Test Matrix (${{ matrix.os }} - Node ${{ matrix.node-version }})
    needs: sovereign-guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['20.x', '22.x', '24.x']

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full CLI, Studio & MCP Integration Test Suite (41 Tests)
        run: node --test scripts/test-cli.mjs

  security-audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Run npm Audit
        run: npm audit --audit-level=high
        continue-on-error: true
