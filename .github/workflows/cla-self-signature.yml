name: CLA Self-Signature Verification

# Automatically validates self-signature PRs that ONLY add the PR author's
# GitHub username to .contributors, preventing the cla-bot signature deadlock.

on:
  pull_request_target:
    branches: [main]
    paths:
      - '.contributors'

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  verify-self-cla:
    name: Verify CLA Self-Signature
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate that diff strictly adds only the author to .contributors
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const files = await github.rest.pulls.listFiles({
              owner, repo, pull_number: pr.number
            });

            if (files.data.length !== 1 || files.data[0].filename !== '.contributors') {
              core.info('PR modifies files other than .contributors. Leaving check to standard cla-bot.');
              return;
            }

            let baseContributors = [];
            try {
              const baseContent = await github.rest.repos.getContent({
                owner, repo, path: '.contributors', ref: pr.base.sha
              });
              baseContributors = JSON.parse(Buffer.from(baseContent.data.content, 'base64').toString('utf8'));
            } catch (e) {
              core.warning('Failed to load base .contributors: ' + e.message);
            }

            let headContributors = [];
            try {
              const headContent = await github.rest.repos.getContent({
                owner, repo, path: '.contributors', ref: pr.head.sha
              });
              headContributors = JSON.parse(Buffer.from(headContent.data.content, 'base64').toString('utf8'));
            } catch (e) {
              core.setFailed('Invalid JSON in proposed .contributors: ' + e.message);
              return;
            }

            const added = headContributors.filter(x => !baseContributors.includes(x));
            const removed = baseContributors.filter(x => !headContributors.includes(x));

            if (removed.length > 0) {
              core.setFailed('CLA signature PR cannot remove existing contributors.');
              return;
            }

            if (added.length === 1 && added[0].toLowerCase() === author.toLowerCase()) {
              core.info(Valid self-CLA signature detected for @. Setting status to success.);
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: pr.head.sha,
                state: 'success',
                context: 'verification/cla-signed',
                description: CLA self-signature PR: @ added to .contributors,
                target_url: https://github.com//roedyrustam/vibes-plug/blob/main/CLA.md
              });
            } else {
              core.setFailed(PR must only add the author (@) to .contributors. Detected: );
            }