name: Deploy Web Showcase to GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'showcase/**'
      - '.github/workflows/deploy-showcase.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Showcase to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Verify Web Showcase Syntax
        run: |
          node --check showcase/app.js
          node --check showcase/skills-data.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Showcase Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './showcase'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
